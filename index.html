<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Учебная геймификация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0B2850">
  <!-- Тема: auto (по системе) / dark / light; применяем до отрисовки, чтобы не мигало -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* без localStorage — тема по системе */ }
  </script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
 <!-- Загружаем конфиг Firebase из /api/env; приложение (src/App.jsx) подключается внизу страницы -->
<script>
  (async function(){
    try {
      const resp = await fetch('/api/env', { cache: 'no-store' });
      if (!resp.ok) throw new Error('env load failed');
      window.env = await resp.json();
    } catch (e) {
      console.error('Не удалось загрузить /api/env', e);
      alert('Ошибка загрузки конфигурации. Проверь переменные окружения на Vercel.');
    }
  })();
</script>
</head>
<body>
  <!-- Контейнер React -->
  <div id="root"></div>

  <!-- Боковая панель -->
  <div id="sidebar" class="sidebar">
    <button class="close-btn" id="closeSidebar" title="Закрыть">
      <span class="material-icons">close</span>
    </button>
    <h2>Администрирование</h2>
    <button class="panel-btn" id="exportBtn">
      <span class="material-icons">download</span> Экспорт CSV
    </button>
    <label class="panel-btn" for="importFile">
      <span class="material-icons">upload</span> Импорт CSV
    </label>
    
 <!-- внутри #sidebar -->
<button class="panel-btn" id="battlePassAdmin">
  <span class="material-icons">military_tech</span> Боевой пропуск
</button>

<button class="panel-btn" id="themeToggle">
  <span class="material-icons">brightness_auto</span> <span class="theme-label">Тема: как в системе</span>
</button>

      <a class="panel-btn" href="faq.html">
    <span class="material-icons">help</span> FAQ / Правила игры
  </a>

    
    <input type="file" accept=".csv" id="importFile" class="file-input">
      <div class="sidebar-footer">
    <img src="logo.png" alt="Логотип" class="sidebar-logo" />
    <div class="sidebar-title">TakeFive</div>
  </div>
  </div>



  <!-- Переключатель темы: авто → тёмная → светлая -->
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      var modes = {
        auto: { icon: 'brightness_auto', label: 'Тема: как в системе', next: 'dark' },
        dark: { icon: 'dark_mode', label: 'Тема: тёмная', next: 'light' },
        light: { icon: 'light_mode', label: 'Тема: светлая', next: 'auto' }
      };
      function current() {
        var t = document.documentElement.dataset.theme;
        return modes[t] ? t : 'auto';
      }
      function render() {
        var m = modes[current()];
        btn.querySelector('.material-icons').textContent = m.icon;
        btn.querySelector('.theme-label').textContent = m.label;
      }
      btn.addEventListener('click', function () {
        var next = modes[current()].next;
        if (next === 'auto') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = next;
        try {
          if (next === 'auto') localStorage.removeItem('theme');
          else localStorage.setItem('theme', next);
        } catch (e) { /* не сохранится — не страшно */ }
        render();
      });
      render();
    })();
  </script>

  <!-- Основное приложение собирает Vite (initFirebase в src/App.jsx сам ждёт window.env) -->
  <script type="module" src="/src/App.jsx"></script>
</body>
</html>
